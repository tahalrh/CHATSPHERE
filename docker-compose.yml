version: '3.9'

# ── ClientFlow — stack complète ───────────────────────────────────────────
# Démarre le backend, le dashboard et Ollama en une commande :
#   docker compose up -d
#
# Puis accédez à :
#   Dashboard : http://localhost:5173
#   Backend   : http://localhost:3001
#   Ollama    : http://localhost:11434

services:

  # ── Ollama : serveur LLM local ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: clientflow-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      # Modèles téléchargés persistés entre redémarrages
      - ollama_data:/root/.ollama
    # Décommenter si vous avez un GPU Nvidia :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Backend : API REST + WebSocket ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clientflow-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      # Copier backend/.env.example → backend/.env et remplir ADMIN_TOKEN
      - ./backend/.env
    environment:
      # Surcharge l'URL Ollama pour pointer vers le conteneur ollama
      OLLAMA_HOST: http://ollama:11434
      # Dossier persistant pour la DB et les backups
      DATA_DIR: /app/data
      # Autorise les requêtes du dashboard (conteneur ou navigateur)
      DASHBOARD_ORIGIN: http://localhost:5173
    volumes:
      # Volume persistant : DB SQLite + backups (ne pas perdre les bots configurés)
      - backend_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/widget/widget.js', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Dashboard : interface admin React (build Vite + Nginx) ─────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # L'URL du backend doit être accessible depuis le navigateur du client,
        # pas depuis l'intérieur du réseau Docker — utiliser l'hôte réel.
        VITE_API_URL: http://localhost:3001
    container_name: clientflow-dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

# ── Volumes persistants ────────────────────────────────────────────────────
volumes:
  ollama_data:
    driver: local
  backend_data:
    driver: local
